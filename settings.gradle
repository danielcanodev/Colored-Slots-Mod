pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases/' }
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'colored_slots'

def versions = ['26.1', '26.2', '1.21.1', '1.21.4', '1.21.5', '1.21.6']
def loaders = ['fabric', 'neoforge', 'forge']

versions.each { v ->
    loaders.each { l ->
        include ":versions:$v:$l"
    }
}