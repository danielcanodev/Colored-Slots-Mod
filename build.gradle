plugins {
	id 'com.modrinth.minotaur' version '2.9.0' apply false
}

allprojects {
    group = 'net.masuno'
    version = rootProject.ext.mod_version
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds every version/loader combination in the matrix.'
    dependsOn subprojects.findAll { it.tasks.findByName('build') != null }.collect { it.tasks.named('build') }
}